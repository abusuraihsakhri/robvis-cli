[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robvis-cli"
version = "1.0.0"
description = "Publication-ready Cochrane Risk of Bias figure generator (RoB 2 & ROBINS-I) from the command line — pure SVG."
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
robvis = "robvis_cli.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/robvis-cli"
Repository = "https://github.com/abusuraihsakhri/robvis-cli.git"
