name: Robvis Cli CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        python -m compileall -q agents robvis_cli cli.py robvis.py simulator.py

    - name: Run Pytest Suite
      env:
        AUDIT_SECRET_KEY: "test-audit-secret-key-for-ci-pipeline-only-2026"
      run: |
        pytest -v

    - name: Validate CLI sample and SVG outputs
      run: |
        python -m robvis_cli.cli validate -i sample_rob2.csv
        python -m robvis_cli.cli traffic-light -i sample_rob2.csv -o /tmp/robvis-traffic.svg
        python -m robvis_cli.cli summary -i sample_robins_i.csv --weighted -o /tmp/robvis-summary.svg
        python -c "import xml.etree.ElementTree as ET; ET.parse('/tmp/robvis-traffic.svg'); ET.parse('/tmp/robvis-summary.svg')"

    - name: Check browser application JavaScript syntax
      run: |
        node -e "const fs=require('fs'); const html=fs.readFileSync('web/index.html','utf8'); const match=html.match(/<script>([\\s\\S]*?)<\\/script>/); if(!match)throw Error('Browser script missing'); new Function(match[1]);"

    - name: Audit integrity and identifier-guard sanity check
      env:
        AUDIT_SECRET_KEY: "test-audit-secret-key-for-ci-pipeline-only-2026"
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
